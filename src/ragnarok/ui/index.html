<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data:">
<title>Ragnarok</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1c1b19;--mute:#6e6b64;--line:#e4e1d9;--accent:#1f5f4a;--accent-ink:#fff;--warn:#a65b00;--bad:#a42d2d;--chip:#edeae1}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--panel:#1f2124;--ink:#ecebe7;--mute:#9a978f;--line:#2e3034;--accent:#5fbf9d;--accent-ink:#0c1a14;--warn:#e0a24a;--bad:#e27a7a;--chip:#2a2d30}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}.dot.on{background:var(--accent)}.dot.off{background:var(--warn)}
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:var(--line);border:0;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--panel);transition:left .15s;box-shadow:0 1px 2px #0004}
.sw[aria-checked=true]{background:var(--accent)}.sw[aria-checked=true]::after{left:21px}
nav{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{flex:1;padding:9px 0;border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;border-bottom:2px solid transparent}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
section{display:none;flex:1;min-height:0;flex-direction:column}section.show{display:flex}
#log,#feed,#src{flex:1;overflow:auto;padding:12px 14px}
.msg{max-width:92%;padding:8px 11px;border-radius:12px;margin:0 0 9px;white-space:pre-wrap;word-wrap:break-word}
.me{background:var(--accent);color:var(--accent-ink);margin-left:auto;border-bottom-right-radius:3px}
.bot{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
.cites{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}.chip{background:var(--chip);color:var(--mute);border-radius:9px;padding:1px 8px;font-size:11.5px}
.sys{color:var(--mute);font-size:12.5px;text-align:center;margin:4px 0 10px}
form{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
input[type=text]{flex:1;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.row .grow{flex:1;min-width:0}
.small{font-size:12px;color:var(--mute)}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:14px 0 6px;font-weight:600}
.ok{color:var(--accent)}.err{color:var(--bad)}
</style>
</head>
<body>
<header>
  <span id="dot" class="dot" title="status"></span>
  <h1>Ragnarok</h1>
  <span class="small" id="state">connecting</span>
  <button id="sw" class="sw" role="switch" aria-checked="true" aria-label="Always-on ingestion"></button>
</header>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-t="chat">Chat</button>
  <button role="tab" aria-selected="false" data-t="inb">Inbox <span id="ibadge" class="small"></span></button>
  <button role="tab" aria-selected="false" data-t="msg">Messages</button>
  <button role="tab" aria-selected="false" data-t="appr">Approvals <span id="badge" class="small"></span></button>
  <button role="tab" aria-selected="false" data-t="act">Activity</button>
  <button role="tab" aria-selected="false" data-t="src">Sources</button>
</nav>
<main>
  <section id="chat" class="show">
    <div id="log" aria-live="polite"><p class="sys">Ask about anything it has read. It answers only from your memory and cites where.</p></div>
    <form id="f"><input id="q" type="text" autocomplete="off" placeholder="Ask your memory" aria-label="Message" maxlength="4000"><button class="btn pri" type="submit">Send</button></form>
  </section>
  <section id="inb"><div style="padding:10px 14px 0;display:flex;gap:8px;align-items:center"><span class="small grow" style="flex:1">What I noticed on my own: meetings, things that need you, your briefing, your triggers.</span><button class="btn" id="idis">Clear all</button></div><div id="ibox" style="flex:1;overflow:auto;padding:8px 14px"></div></section>
  <section id="msg"><div style="padding:10px 14px 0"><input id="mq" type="text" placeholder="Search what has been read" aria-label="Search messages" maxlength="200" style="width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></div><div style="padding:6px 14px"><div class="small" style="font-weight:600">Remembered</div><div id="facts"></div><div class="row"><button class="btn" id="exj">Export JSON</button><button class="btn" id="exm">Export Markdown</button><span class="small" id="exs"></span></div></div><div id="msgs" style="flex:1;overflow:auto;padding:8px 14px"></div></section>
  <section id="appr"><div id="cards" style="flex:1;overflow:auto;padding:12px 14px"></div></section>
  <section id="act"><div id="feed"></div></section>
  <section id="src"><div id="srcbox"></div></section>
</main>
<script>
(function(){
  var tok=(location.hash.match(/token=([\w-]+)/)||[])[1]||"";
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  var H={"x-ragnarok-token":tok,"content-type":"application/json"};
  function api(p,body){return fetch(p,body===undefined?{headers:H}:{method:"POST",headers:H,body:JSON.stringify(body)}).then(function(r){return r.json()})}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
  var tabs=document.querySelectorAll("nav button");
  tabs.forEach(function(b){b.onclick=function(){tabs.forEach(function(o){o.setAttribute("aria-selected",o===b)});document.querySelectorAll("section").forEach(function(s){s.classList.toggle("show",s.id===b.dataset.t)})}});
  var log=document.getElementById("log"),q=document.getElementById("q");
  function add(cls,text,cites){var m=el("div","msg "+cls,text);if(cites&&cites.length){var c=el("div","cites");cites.forEach(function(x){c.appendChild(el("span","chip","["+x.n+"] "+(x.citation||x.kind||"memory")))});m.appendChild(c)}log.appendChild(m);log.scrollTop=log.scrollHeight;return m}
  function show(w,d){w.remove();var t=d.ok===false?"The agent is not ready ("+(d.error||"error")+").":d.text;var m=add("bot",t,d.citations);
    if(d.ok!==false&&d.tier){var meta=el("div","small",d.tier+" via "+d.backend+(d.ms?" - "+d.ms+" ms":"")+(d.learned==="promoted"?" - learned a route":d.learned==="route_used"?" - stored route":"")+"  ");
      if(d.why&&d.why.length){var wl=el("a","small","Why?");wl.href="#";var pre=el("div","small",d.why.join("\n"));pre.style.cssText="white-space:pre-wrap;display:none;margin-top:4px;border-left:2px solid var(--line);padding-left:8px";wl.onclick=function(ev){ev.preventDefault();pre.style.display=pre.style.display==="none"?"block":"none"};meta.appendChild(wl);m.appendChild(meta);m.appendChild(pre)}else m.appendChild(meta)}}
  function poll(w,job,n){api("/chat/"+job).then(function(d){if(d.pending&&n<400){setTimeout(function(){poll(w,job,n+1)},1000)}else show(w,d)}).catch(function(){w.remove();add("bot","Lost contact with the agent.")})}
  document.getElementById("f").onsubmit=function(e){e.preventDefault();var t=q.value.trim();if(!t)return;q.value="";add("me",t);var w=add("bot","Working on it...");
    api("/chat",{text:t}).then(function(d){if(d.pending){w.firstChild.textContent="Waiting - if it needs your OK, check the Approvals tab...";poll(w,d.job,0)}else show(w,d)}).catch(function(){w.remove();add("bot","Could not reach the agent.")})};
  var sw=document.getElementById("sw");
  sw.onclick=function(){var on=sw.getAttribute("aria-checked")!=="true";api("/toggle",{enabled:on}).then(refresh)};
  function ago(ts){var s=Math.max(0,(Date.now()-ts)/1000|0);return s<60?s+"s ago":s<3600?(s/60|0)+"m ago":(s/3600|0)+"h ago"}
  function refresh(){
    api("/status").then(function(d){
      var rt=d.runtime||{},on=!!rt.enabled;sw.setAttribute("aria-checked",on);
      document.getElementById("dot").className="dot "+(on?"on":"off");document.getElementById("state").textContent=on?"reading continuously":"paused";
      var box=document.getElementById("srcbox");box.textContent="";
      var names=Object.keys(rt.sources||{});
      if(!names.length)box.appendChild(el("p","small","No sources connected yet. Run: ragnarok connect <name>"));
      names.forEach(function(n){var s=rt.sources[n],r=el("div","row"),g=el("div","grow");g.appendChild(el("div","",n));
        g.appendChild(el("div","small "+(s.ok===false?"err":""),s.ok===null?"waiting for first sync":s.ok?("last sync "+ago(s.at)+" - "+(s.ingested||0)+" new"):("problem: "+s.code)));
        r.appendChild(g);r.appendChild(el("span",s.ok?"ok":s.ok===false?"err":"small",s.ok?"OK":s.ok===false?"!":"..."));box.appendChild(r)});
      var st=el("div","card");st.style.marginTop="12px";st.appendChild(el("div","","Proactive"));var hint=el("div","small","Daily briefing time (empty = off) and system notifications.");st.appendChild(hint);
      var bt=el("input");bt.type="time";bt.id="briefat";bt.style.cssText="margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)";st.appendChild(bt);
      var sv=el("button","btn","Save");sv.style.marginLeft="8px";sv.onclick=function(){var v=bt.value;api("/proactive",v?{briefing_at:v}:{briefing_off:true}).then(function(){sv.textContent="Saved";setTimeout(function(){sv.textContent="Save"},1200)})};st.appendChild(sv);
      api("/inbox").then(function(d){if(d.settings&&d.settings.briefing_at)bt.value=d.settings.briefing_at});box.appendChild(st);
      var b=document.createElement("div");var sync=el("button","btn","Sync now");sync.onclick=function(){sync.disabled=true;sync.textContent="Syncing...";api("/tick",{}).then(function(){sync.disabled=false;sync.textContent="Sync now";refresh()})};b.style.marginTop="12px";b.appendChild(sync);box.appendChild(b);
      renderFeed(rt.held||[]);
    }).catch(function(){document.getElementById("state").textContent="offline"});
    api("/activity").then(function(d){window.__items=d.items||[];renderFeed(window.__held||[])}).catch(function(){});
  }
  function renderFeed(held){window.__held=held;var f=document.getElementById("feed");f.textContent="";
    if(held.length){f.appendChild(el("h2","","Waiting for you"));held.forEach(function(h){var c=el("div","card");c.appendChild(el("div","",h.platform+": new sender "+h.handle));c.appendChild(el("div","small","Unknown senders are held until you approve them."));
      var row=el("div","row");var a=el("button","btn pri","Approve"),bl=el("button","btn","Block");
      a.onclick=function(){api("/pairing",{platform:h.platform,handle:h.handle,action:"approve"}).then(refresh)};bl.onclick=function(){api("/pairing",{platform:h.platform,handle:h.handle,action:"block"}).then(refresh)};
      row.appendChild(a);row.appendChild(bl);c.appendChild(row);f.appendChild(c)})}
    f.appendChild(el("h2","","Recent activity"));var items=window.__items||[];if(!items.length)f.appendChild(el("p","small","Nothing yet."));
    items.forEach(function(i){var r=el("div","row"),g=el("div","grow");var line=i.kind==="reminder"?("Reminder: "+i.text):i.kind==="ingested"?("Read "+i.ingested+" new from "+i.source+(i.held?(", "+i.held+" held"):"")):i.kind==="error"?(i.source+": "+i.code):i.kind==="toggle"?("Switched "+i.code):i.kind==="paired"?(i.source+" sender "+i.code):(i.source+" "+i.code);
      g.appendChild(el("div",i.kind==="error"?"err":"",line));g.appendChild(el("div","small",ago(i.ts)));r.appendChild(g);f.appendChild(r)})}
  function renderCards(items){var box=document.getElementById("cards");box.textContent="";document.getElementById("badge").textContent=items.length?("("+items.length+")"):"";
    if(!items.length){box.appendChild(el("p","small","Nothing waiting. Anything that sends, posts or changes something outside this computer appears here first, and only goes after you click Approve."));return}
    items.forEach(function(c){var d=el("div","card");d.appendChild(el("div","",c.headline||c.skill));
      (c.fields||[]).forEach(function(f){var r=el("div","small",f.name+": "+String(f.value).slice(0,400));r.style.whiteSpace="pre-wrap";d.appendChild(r)});
      if(c.tainted)d.appendChild(el("div","small err","Based on content received from outside - check it carefully."));
      (c.warnings||[]).forEach(function(w){d.appendChild(el("div","small err",w))});
      var typed=null;if(c.stepup){d.appendChild(el("div","small","Type "+c.stepup.phrase+" to confirm."));typed=el("input");typed.type="text";typed.style.cssText="width:100%;margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)";d.appendChild(typed)}
      var row=el("div","row"),a=el("button","btn pri","Approve"),n=el("button","btn","Deny");
      a.onclick=function(){a.disabled=n.disabled=true;api("/approvals/"+c.id,{action:"approve",phrase:typed?typed.value:null}).then(function(r){if(r.ok===false){d.appendChild(el("div","small err","Not approved: "+(r.error||"refused")));a.disabled=n.disabled=false}else pullCards()})};
      n.onclick=function(){a.disabled=n.disabled=true;api("/approvals/"+c.id,{action:"deny"}).then(pullCards)};
      row.appendChild(a);row.appendChild(n);d.appendChild(row);box.appendChild(d)})}
  function pullCards(){api("/approvals").then(function(d){renderCards(d.items||[])}).catch(function(){})}
  function loadMsgs(){var q=document.getElementById("mq").value.trim();api("/messages?limit=60"+(q?"&q="+encodeURIComponent(q):"")).then(function(d){var b=document.getElementById("msgs");b.textContent="";var it=d.items||[];
      if(!it.length)b.appendChild(el("p","small",q?"Nothing matches.":"Nothing has been read yet. Connected sources are polled every minute."));
      it.forEach(function(m){var r=el("div","row"),g=el("div","grow");g.appendChild(el("div","small",m.source+" - "+(m.title||m.kind)+" - "+ago(m.ts)+(m.trust==="received"?" - from outside":"")));g.appendChild(el("div","",m.preview||""));var dl=el("button","btn","Delete");dl.style.marginTop="4px";dl.onclick=function(){delPreview(m,g,dl)};if(m.deep_link){var l=el("a","small","Open in "+m.source);l.href=m.deep_link;l.target="_blank";l.rel="noopener noreferrer";g.appendChild(l);g.appendChild(document.createTextNode(" "))}g.appendChild(dl);r.appendChild(g);b.appendChild(r)})}).catch(function(){})}
  function delPreview(m,g,btn){btn.disabled=true;api("/memory/delete/preview",{item_ids:[m.id]}).then(function(p){btn.disabled=false;var box=el("div","card");box.appendChild(el("div","small",p.summary||"Permanently delete this?"));
      var row=el("div","row"),ok=el("button","btn pri","Delete permanently"),no=el("button","btn","Cancel");no.onclick=function(){box.remove()};
      ok.onclick=function(){ok.disabled=true;api("/memory/delete",{item_ids:[m.id],token:p.token}).then(function(r){box.textContent="";box.appendChild(el("div","small",r.ok?("Deleted. Verification scan found "+r.residual+" traces left."):("Not deleted: "+(r.error||"refused"))));setTimeout(loadMsgs,1200)})};
      row.appendChild(ok);row.appendChild(no);box.appendChild(row);g.appendChild(box)})}
  function loadFacts(){api("/memory/facts").then(function(d){var b=document.getElementById("facts");b.textContent="";var it=d.items||[];if(!it.length){b.appendChild(el("div","small","Nothing remembered yet. Say: remember that I prefer morning meetings."));return}
      it.slice(0,8).forEach(function(f){var r=el("div","row"),g=el("div","grow");g.appendChild(el("div","small",f.kind+" - from "+f.trust+" - "+f.evidence+" evidence"));var txt=f.kind==="preference"?("you "+f.predicate+" "+f.value):f.kind==="attribute"?("your "+f.predicate+": "+f.value):f.value;g.appendChild(el("div","",txt));
        var ed=el("button","btn","Edit");ed.onclick=function(){if(g.querySelector("input"))return;var inp=el("input");inp.type="text";inp.value=f.value;inp.style.cssText="width:100%;margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)";
          var sv=el("button","btn pri","Save");sv.onclick=function(){if(inp.value.trim())api("/memory/facts/"+f.id,{value:inp.value.trim()}).then(loadFacts)};g.appendChild(inp);g.appendChild(sv)};
        var dl=el("button","btn","Forget");dl.onclick=function(){api("/memory/delete/preview",{fact_ids:[f.id]}).then(function(p){var box=el("div","card");box.appendChild(el("div","small",p.summary||"Forget this permanently?"));var rr=el("div","row"),ok=el("button","btn pri","Forget permanently"),no=el("button","btn","Cancel");no.onclick=function(){box.remove()};
          ok.onclick=function(){api("/memory/delete",{fact_ids:[f.id],token:p.token}).then(loadFacts)};rr.appendChild(ok);rr.appendChild(no);box.appendChild(rr);g.appendChild(box)})};
        var row=el("div","row");row.appendChild(ed);row.appendChild(dl);g.appendChild(row);r.appendChild(g);b.appendChild(r)})}).catch(function(){})}
  document.getElementById("exj").onclick=function(){var s=document.getElementById("exs");s.textContent="Exporting...";api("/memory/export?fmt=json",{}).then(function(r){s.textContent=r.ok?("Saved "+r.items+" items, "+r.facts+" facts to "+r.path):"Export failed"})};
  document.getElementById("exm").onclick=function(){var s=document.getElementById("exs");s.textContent="Exporting...";api("/memory/export?fmt=md",{}).then(function(r){s.textContent=r.ok?("Saved to "+r.path):"Export failed"})};
  var mt;document.getElementById("mq").oninput=function(){clearTimeout(mt);mt=setTimeout(loadMsgs,300)};
  tabs.forEach(function(b){b.addEventListener("click",function(){if(b.dataset.t==="msg"){loadMsgs();loadFacts()}})});setInterval(function(){if(document.getElementById("msg").classList.contains("show")&&!document.getElementById("mq").value)loadMsgs()},5000);
  var KIND={attention:"Needs you",heads_up:"Heads-up",briefing:"Briefing",alert:"Alert",reminder:"Reminder",scheduled:"Scheduled"};
  function loadInbox(){api("/inbox").then(function(d){var it=d.items||[],b=document.getElementById("ibox");b.textContent="";document.getElementById("ibadge").textContent=it.length?("("+it.length+")"):"";
      if(!it.length)b.appendChild(el("p","small","Nothing new. Try: every day at 8am catch me up on my emails, or: when I get an email from Dev, tell me."));
      it.forEach(function(m){var c=el("div","card");c.appendChild(el("div","small",(KIND[m.kind]||m.kind)+" - "+ago(m.ts)+(m.source?" - "+m.source:"")));c.appendChild(el("div","",m.title));var bd=el("div","small",m.body);bd.style.whiteSpace="pre-wrap";c.appendChild(bd);
        var row=el("div","row");if(m.link){var l=el("a","small","Open");l.href=m.link;l.target="_blank";l.rel="noopener noreferrer";row.appendChild(l)}var x=el("button","btn","Dismiss");x.onclick=function(){api("/inbox/dismiss?item_id="+encodeURIComponent(m.id),{}).then(loadInbox)};row.appendChild(x);c.appendChild(row);b.appendChild(c)})}).catch(function(){})}
  document.getElementById("idis").onclick=function(){api("/inbox/dismiss",{}).then(loadInbox)};
  tabs.forEach(function(b){b.addEventListener("click",function(){if(b.dataset.t==="inb")loadInbox()})});setInterval(loadInbox,5000);
  refresh();pullCards();loadInbox();setInterval(refresh,4000);setInterval(pullCards,1500);
})();
</script>
</body>
</html>
