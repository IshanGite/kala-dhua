<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data:">
<title>Muninn</title>
<style>
/* A glass orb that hovers where Ragnarok is pinned. Pure vector (gradients and clip paths, no CSS filters and no box), so it stays sharp at any screen density and no frame ever shows around it. */
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:pointer;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#row{position:absolute;inset:0;display:flex;align-items:center;gap:4px}
#row.right{flex-direction:row-reverse}
#bolt{width:72px;height:92px;flex:none;position:relative;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
#row:hover #bolt{transform:scale(1.12)}
svg{width:100%;height:100%;overflow:visible;display:block;shape-rendering:geometricPrecision}
#float{animation:float 4.2s ease-in-out infinite;transform-origin:36px 40px}
@keyframes float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-5px)}}
#shadow{transform-origin:36px 82px;animation:shadow 4.2s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.05);opacity:.28}}
#halo{transform-origin:36px 40px;animation:halo 3.6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.6;transform:scale(.93)}50%{opacity:1;transform:scale(1.07)}}
.sw{transform-origin:36px 40px}
#sw1{animation:spin 11s linear infinite}#sw2{animation:spin 17s linear infinite reverse}#sw3{animation:spin 23s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#lat1{transform-origin:36px 40px;animation:spin 29s linear infinite}#lat2{transform-origin:36px 40px;animation:spin 41s linear infinite reverse}
#core{transform-origin:36px 40px;animation:core 2.8s ease-in-out infinite}
@keyframes core{0%,100%{opacity:.7;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.tw{fill:#fff3d1;opacity:0;animation:tw 3.4s ease-in-out infinite}
.tw:nth-of-type(2){animation-delay:.9s}.tw:nth-of-type(3){animation-delay:1.8s}.tw:nth-of-type(4){animation-delay:2.4s}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.95;transform:scale(1)}}
.tw{transform-box:fill-box;transform-origin:center}
#ring{fill:none;stroke:#ffd877;stroke-width:1.4;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(2)}}
.zap #flash{animation:flash .6s ease-out 1}
#flash{opacity:0}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.sleep #bolt{opacity:.55;animation:ember 6s ease-in-out infinite}
.sleep #float,.sleep #sw1,.sleep #sw2,.sleep #sw3,.sleep #halo{animation-duration:14s}
@keyframes ember{0%,100%{opacity:.45}50%{opacity:.68}}
.alert #bolt{animation:flare .8s cubic-bezier(.3,1.6,.5,1) 3}
.alert #halo{animation:halo .5s ease-in-out infinite}
.alert #ring{animation:ring .9s ease-out 3}
@keyframes flare{0%{transform:scale(1)}25%{transform:scale(1.25)}50%{transform:scale(.96)}75%{transform:scale(1.12)}100%{transform:scale(1)}}
#bubble{max-width:188px;background:linear-gradient(180deg,#fff8e6,#f3e6c4);color:#2a1d08;font:600 12.5px/1.3 system-ui,sans-serif;border-radius:13px;padding:8px 11px;box-shadow:0 3px 14px #0008;opacity:0;transform:translateX(var(--bx,8px)) scale(.92);transform-origin:center;transition:opacity .22s,transform .25s cubic-bezier(.3,1.5,.5,1);display:none;word-break:break-word;border:1px solid #d8a93a}
#row.right #bubble{--bx:10px}#row.left #bubble{--bx:-10px}
#bubble.on{opacity:1;transform:translateX(0) scale(1)}
#dot{position:absolute;right:6px;top:2px;min-width:17px;height:17px;border-radius:9px;background:#ff6b5e;color:#fff;font:700 10.5px/17px system-ui;text-align:center;display:none;padding:0 4px;box-shadow:0 1px 4px #0007;animation:pop .3s cubic-bezier(.3,1.8,.5,1);z-index:2}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="row" class="right" title="Click to bring Ragnarok back">
  <div id="bolt">
    <div id="dot"></div>
    <svg viewBox="0 0 72 92" aria-label="A glowing orb">
      <defs>
        <radialGradient id="halog" cx="50%" cy="50%" r="50%"><stop offset=".45" stop-color="#5cc8ff" stop-opacity=".5"/><stop offset=".75" stop-color="#3a7bff" stop-opacity=".14"/><stop offset="1" stop-color="#3a7bff" stop-opacity="0"/></radialGradient>
        <radialGradient id="base" cx="34%" cy="28%" r="82%"><stop offset="0" stop-color="#e6f6ff"/><stop offset=".22" stop-color="#7fd4ff"/><stop offset=".55" stop-color="#2f6fe0"/><stop offset=".82" stop-color="#14338f"/><stop offset="1" stop-color="#070f33"/></radialGradient>
        <radialGradient id="bl1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff3d1" stop-opacity=".85"/><stop offset="1" stop-color="#ffd877" stop-opacity="0"/></radialGradient>
        <radialGradient id="bl2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9a8bff" stop-opacity=".75"/><stop offset="1" stop-color="#6a5cff" stop-opacity="0"/></radialGradient>
        <radialGradient id="bl3" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5cf0ff" stop-opacity=".7"/><stop offset="1" stop-color="#2aa8ff" stop-opacity="0"/></radialGradient>
        <radialGradient id="corg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#ffe9a8" stop-opacity=".85"/><stop offset="1" stop-color="#ffc94d" stop-opacity="0"/></radialGradient>
        <radialGradient id="fres" cx="50%" cy="50%" r="50%"><stop offset=".62" stop-color="#9fd8ff" stop-opacity="0"/><stop offset=".9" stop-color="#9fd8ff" stop-opacity=".38"/><stop offset="1" stop-color="#eaf6ff" stop-opacity=".85"/></radialGradient>
        <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <radialGradient id="bounce" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#ffd877" stop-opacity=".6"/><stop offset="1" stop-color="#ffd877" stop-opacity="0"/></radialGradient>
        <radialGradient id="shg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#001a1c" stop-opacity=".55"/><stop offset="1" stop-color="#001a1c" stop-opacity="0"/></radialGradient>
        <clipPath id="orb"><circle cx="36" cy="40" r="27"/></clipPath>
      </defs>
      <ellipse id="shadow" cx="36" cy="82" rx="20" ry="3.6" fill="url(#shg)"/>
      <circle id="halo" cx="36" cy="40" r="38" fill="url(#halog)"/>
      <circle id="ring" cx="36" cy="40" r="26"/>
      <g id="float">
        <circle cx="36" cy="40" r="27" fill="url(#base)"/>
        <g clip-path="url(#orb)">
          <g id="sw1" class="sw"><ellipse cx="22" cy="34" rx="19" ry="12" fill="url(#bl1)"/></g>
          <g id="sw2" class="sw"><ellipse cx="50" cy="46" rx="18" ry="13" fill="url(#bl2)"/></g>
          <g id="sw3" class="sw"><ellipse cx="36" cy="58" rx="20" ry="10" fill="url(#bl3)"/></g>
          <g id="lat1"><ellipse cx="36" cy="40" rx="27" ry="9" fill="none" stroke="#eaf6ff" stroke-opacity=".16" stroke-width=".6"/></g>
          <g id="lat2"><ellipse cx="36" cy="40" rx="10" ry="27" fill="none" stroke="#eaf6ff" stroke-opacity=".14" stroke-width=".6"/></g>
          <circle id="core" cx="36" cy="40" r="11" fill="url(#corg)"/>
          <ellipse cx="36" cy="66" rx="20" ry="9" fill="url(#bounce)"/>
        </g>
        <circle cx="36" cy="40" r="27" fill="url(#fres)"/>
        <circle cx="36" cy="40" r="26.7" fill="none" stroke="#dffff9" stroke-opacity=".5" stroke-width=".7"/>
        <ellipse cx="26.5" cy="26" rx="11" ry="5.6" transform="rotate(-32 26.5 26)" fill="url(#spec)" opacity=".92"/>
        <circle cx="21" cy="33" r="1.5" fill="#fff" opacity=".75"/>
        <circle id="flash" cx="36" cy="40" r="27" fill="#fff"/>
        <circle class="tw" cx="9" cy="22" r="1.2"/><circle class="tw" cx="63" cy="30" r="1.4"/><circle class="tw" cx="60" cy="64" r="1.1"/><circle class="tw" cx="12" cy="62" r="1.3"/>
        <g transform="rotate(-18 36 40)"><circle r="1.7" fill="#fff3d1"><animateMotion dur="5.5s" repeatCount="indefinite" path="M72,40 A36,9 0 1 1 0,40 A36,9 0 1 1 72,40 Z"/></circle><circle r="1.1" fill="#ffd877"><animateMotion dur="5.5s" begin="-2.7s" repeatCount="indefinite" path="M72,40 A36,9 0 1 1 0,40 A36,9 0 1 1 72,40 Z"/></circle></g>
      </g>
    </svg>
  </div>
  <div id="bubble"></div>
</div>
<script>
(function(){
  var tok=(location.hash.match(/token=([\w-]+)/)||[])[1]||"",H={"x-ragnarok-token":tok,"content-type":"application/json"};
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  function api(p,b){return fetch(p,b===undefined?{headers:H}:{method:"POST",headers:H,body:JSON.stringify(b)}).then(function(r){return r.json()})}
  var row=document.getElementById("row"),bub=document.getElementById("bubble"),dot=document.getElementById("dot");
  var W=72,Hh=92,edge="right",sleeping=false,last=Date.now(),queue=[],talking=false,seen={};
  function side(e){edge=e||"right";row.className=(edge==="left"?"left":"right")+(sleeping?" sleep":"")}
  side("right");
  // keep the orb at the screen edge: the bubble opens toward the middle of the screen
  setInterval(function(){api("/shell/poll").then(function(d){if(d&&d.edge&&d.edge!==edge)side(d.edge)}).catch(function(){})},1000);
  // life: a crackle now and then; it dims after a while with nothing to say, and wakes when something happens or the mouse comes near
  function zap(){if(sleeping)return;row.classList.add("zap");setTimeout(function(){row.classList.remove("zap")},520)}
  setInterval(function(){if(Math.random()<.5)zap()},3600);
  setInterval(function(){if(!sleeping&&!talking&&Date.now()-last>90000){sleeping=true;row.classList.add("sleep")}},5000);
  function wake(){last=Date.now();if(sleeping){sleeping=false;row.classList.remove("sleep")}}
  document.addEventListener("mouseover",function(){wake();zap()});
  // news from the app: an approval waiting, a reminder, something that needs you. One at a time, never cut off: the window grows to fit the words.
  function say(t,ms){queue.push([String(t).slice(0,110),ms||6000]);next()}
  function next(){if(talking||!queue.length)return;talking=true;var m=queue.shift();wake();
    bub.textContent=m[0];bub.style.display="block";bub.className="";
    var w=Math.min(272,W+6+Math.min(190,Math.max(96,m[0].length*7+26))),h=Math.max(Hh,bub.offsetHeight+14);
    api("/shell/mascot/size",{w:w,h:h}).catch(function(){});
    setTimeout(function(){bub.className="on";row.classList.add("alert")},140);
    setTimeout(function(){bub.className="";row.classList.remove("alert");setTimeout(function(){bub.style.display="none";api("/shell/mascot/size",{w:W,h:Hh}).catch(function(){});setTimeout(function(){talking=false;next()},300)},240)},m[1])}
  function poll(){api("/approvals").then(function(d){var n=(d.items||[]).length;dot.style.display=n?"block":"none";dot.textContent=n;
      (d.items||[]).forEach(function(c){if(!seen["a"+c.id]){seen["a"+c.id]=1;say("Waiting for your OK: "+(c.headline||c.skill),6500)}})}).catch(function(){});
    api("/inbox").then(function(d){var first=Object.keys(seen).length===0;(d.items||[]).slice(0,4).forEach(function(m){if(!seen["i"+m.id]&&(m.kind==="reminder"||m.kind==="attention"||m.kind==="alert"||m.kind==="heads_up")){seen["i"+m.id]=1;if(!first)say(m.title,6500)}else seen["i"+m.id]=1})}).catch(function(){})}
  setInterval(poll,2500);poll();
  // a click (not a drag) brings Ragnarok back; dragging moves the bolt along the screen edge
  var down=null,moved=false;
  row.addEventListener("mousedown",function(e){down={x:e.screenX,y:e.screenY};moved=false;wake()});
  document.addEventListener("mousemove",function(e){if(!down)return;var dx=e.screenX-down.x,dy=e.screenY-down.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){api("/shell/mascot/move",{dx:dx,dy:dy});down={x:e.screenX,y:e.screenY}}});
  document.addEventListener("mouseup",function(){if(down&&!moved){api("/shell/restore",{})}else if(down&&moved){api("/shell/mascot/dropped",{})}down=null});
})();
</script>
</body>
</html>
