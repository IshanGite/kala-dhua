<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data:">
<title>Muninn</title>
<style>
/* A small bolt of lightning that waits where Ragnarok is pinned: calm and dim when nothing is happening, flaring with a message when something needs you. */
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:pointer;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#row{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 2px}
#row.right{flex-direction:row-reverse}
#bolt{width:52px;height:80px;flex:none;position:relative;filter:drop-shadow(0 0 5px #38d6b0aa) drop-shadow(0 0 12px #38d6b055);animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 60%}
svg{width:100%;height:100%;overflow:visible}
.core{fill:url(#g)}
.rim{fill:none;stroke:#e8fffb;stroke-width:1.1;stroke-linejoin:round;opacity:.9}
.arc{fill:none;stroke:#bffcf0;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 4px #38d6b099) drop-shadow(0 0 9px #38d6b044);scale:1}50%{filter:drop-shadow(0 0 7px #38d6b0cc) drop-shadow(0 0 16px #38d6b077);scale:1.025}}
@keyframes flick{0%,100%{opacity:1}6%{opacity:.55}9%{opacity:1}52%{opacity:1}54%{opacity:.7}57%{opacity:1}}
#bolt .core{animation:flick 6.5s steps(1) infinite}
.zap .arc{animation:arc .42s steps(2) 1}
@keyframes arc{0%{opacity:0}20%{opacity:1}55%{opacity:.25}75%{opacity:1}100%{opacity:0}}
.sleep #bolt{animation:ember 4.5s ease-in-out infinite;filter:drop-shadow(0 0 3px #38d6b055)}
@keyframes ember{0%,100%{opacity:.5}50%{opacity:.78}}
.alert #bolt{animation:flare .9s ease-out 3;filter:drop-shadow(0 0 9px #8ffff0) drop-shadow(0 0 22px #38d6b0)}
.alert .arc{animation:arc .3s steps(2) 6}
@keyframes flare{0%{scale:1}15%{scale:1.22}30%{scale:.96}45%{scale:1.14}100%{scale:1}}
#row:hover #bolt{filter:drop-shadow(0 0 8px #8ffff0) drop-shadow(0 0 18px #38d6b0)}
#bubble{max-width:188px;background:#eefdf9;color:#10231f;font:600 12.5px/1.3 system-ui,sans-serif;border-radius:12px;padding:8px 11px;box-shadow:0 3px 14px #0008;opacity:0;transform:scale(.9);transform-origin:center;transition:opacity .2s,transform .2s;display:none;word-break:break-word;border:1px solid #38d6b0}
#bubble.on{opacity:1;transform:scale(1)}
#dot{position:absolute;right:-2px;top:-2px;min-width:17px;height:17px;border-radius:9px;background:#ff6b5e;color:#fff;font:700 10.5px/17px system-ui;text-align:center;display:none;padding:0 4px;box-shadow:0 1px 4px #0007}
</style>
</head>
<body>
<div id="row" class="right" title="Click to bring Ragnarok back">
  <div id="bolt">
    <div id="dot"></div>
    <svg viewBox="0 0 60 100" aria-label="A small bolt of lightning">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#f4fffd"/><stop offset=".45" stop-color="#7ff5df"/><stop offset="1" stop-color="#18a98d"/></linearGradient></defs>
      <path class="arc" d="M6 30 L14 34 L9 42 L19 46"/><path class="arc" d="M54 62 L46 66 L51 74 L41 78"/><path class="arc" d="M10 78 L18 76 L15 86"/><path class="arc" d="M50 20 L43 25 L47 31"/>
      <path class="core" d="M41 0 L5 55 L25 55 L9 100 L56 36 L34 36 L52 0 Z"/>
      <path class="rim" d="M41 0 L5 55 L25 55 L9 100 L56 36 L34 36 L52 0 Z"/>
    </svg>
  </div>
  <div id="bubble"></div>
</div>
<script>
(function(){
  var tok=(location.hash.match(/token=([\w-]+)/)||[])[1]||"",H={"x-ragnarok-token":tok,"content-type":"application/json"};
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  function api(p,b){return fetch(p,b===undefined?{headers:H}:{method:"POST",headers:H,body:JSON.stringify(b)}).then(function(r){return r.json()})}
  var row=document.getElementById("row"),bub=document.getElementById("bubble"),dot=document.getElementById("dot");
  var edge="right",sleeping=false,last=Date.now(),queue=[],talking=false,seen={};
  function side(e){edge=e||"right";row.className=(edge==="left"?"left":"right")+(sleeping?" sleep":"")}
  side("right");
  // keep the bolt at the screen edge: the bubble opens toward the middle of the screen
  setInterval(function(){api("/shell/poll").then(function(d){if(d&&d.edge&&d.edge!==edge)side(d.edge)}).catch(function(){})},1000);
  // life: a crackle now and then; it dims after a while with nothing to say, and wakes when something happens or the mouse comes near
  function zap(){if(sleeping)return;row.classList.add("zap");setTimeout(function(){row.classList.remove("zap")},500)}
  setInterval(function(){if(Math.random()<.45)zap()},3800);
  setInterval(function(){if(!sleeping&&!talking&&Date.now()-last>90000){sleeping=true;row.classList.add("sleep")}},5000);
  function wake(){last=Date.now();if(sleeping){sleeping=false;row.classList.remove("sleep")}}
  document.addEventListener("mouseover",function(){wake();zap()});
  // news from the app: an approval waiting, a reminder, something that needs you. One at a time, never cut off: the window grows to fit the words.
  function say(t,ms){queue.push([String(t).slice(0,110),ms||6000]);next()}
  function next(){if(talking||!queue.length)return;talking=true;var m=queue.shift();wake();
    bub.textContent=m[0];bub.style.display="block";bub.className="";
    var w=Math.min(260,56+10+Math.min(188,Math.max(90,m[0].length*7+26))),h=Math.max(84,bub.offsetHeight+14);
    api("/shell/mascot/size",{w:w,h:h}).catch(function(){});
    setTimeout(function(){bub.className="on";row.classList.add("alert")},120);
    setTimeout(function(){bub.className="";row.classList.remove("alert");setTimeout(function(){bub.style.display="none";api("/shell/mascot/size",{w:56,h:84}).catch(function(){});setTimeout(function(){talking=false;next()},300)},220)},m[1])}
  function poll(){api("/approvals").then(function(d){var n=(d.items||[]).length;dot.style.display=n?"block":"none";dot.textContent=n;
      (d.items||[]).forEach(function(c){if(!seen["a"+c.id]){seen["a"+c.id]=1;say("Waiting for your OK: "+(c.headline||c.skill),6500)}})}).catch(function(){});
    api("/inbox").then(function(d){var first=Object.keys(seen).length===0;(d.items||[]).slice(0,4).forEach(function(m){if(!seen["i"+m.id]&&(m.kind==="reminder"||m.kind==="attention"||m.kind==="alert"||m.kind==="heads_up")){seen["i"+m.id]=1;if(!first)say(m.title,6500)}else seen["i"+m.id]=1})}).catch(function(){})}
  setInterval(poll,2500);poll();
  // a click (not a drag) brings Ragnarok back; dragging moves the bolt along the screen edge
  var down=null,moved=false;
  row.addEventListener("mousedown",function(e){down={x:e.screenX,y:e.screenY};moved=false;wake()});
  document.addEventListener("mousemove",function(e){if(!down)return;var dx=e.screenX-down.x,dy=e.screenY-down.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){api("/shell/mascot/move",{dx:dx,dy:dy});down={x:e.screenX,y:e.screenY}}});
  document.addEventListener("mouseup",function(){if(down&&!moved){api("/shell/restore",{})}else if(down&&moved){api("/shell/mascot/dropped",{})}down=null});
})();
</script>
</body>
</html>
