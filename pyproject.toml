[project]
name = "ragnarok"
version = "0.1.0"
description = "Ragnarok: a sovereign, always-on personal AI agent that runs entirely on your own machine."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "numpy>=1.26",
  "psutil>=5.9",
  "keyring>=25.0",
  "watchdog>=4.0",
  "platformdirs>=4.2",
  "cryptography>=42.0",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "typer>=0.12",
  "pyyaml>=6.0",
  "send2trash>=1.8",
  "sqlcipher3-wheels>=0.5.4",
]

[project.optional-dependencies]
laya = ["laya"]
connectors = [
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
  "slack-sdk>=3.30",
  "discord.py>=2.4",
]
parsing = ["pypdf>=4.2", "python-docx>=1.1", "icalendar>=5.0"]

[project.scripts]
ragnarok = "ragnarok.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragnarok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live and not slow and not gpu'"
asyncio_mode = "auto"
markers = [
  "live: needs a real account or live model",
  "gpu: needs a GPU",
  "slow: long running (soak, benchmarks)",
  "macos: macOS only",
  "windows: Windows only",
  "needs_container: needs Docker or Podman",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
